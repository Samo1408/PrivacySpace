plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

android {
    namespace 'cn.geektang.privacyspace'
    compileSdk 35

    defaultConfig {
        applicationId "cn.geektang.privacyspace"
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            keyAlias System.env.Space_keyAlias
            keyPassword System.env.Space_keyPassword
            storeFile file(System.env.Space_storeFile)
            storePassword System.env.Space_storePassword
        }
    }

    buildTypes {
        debug {
            buildConfigField('String', 'APP_CENTER_SECRET', "\"${System.env.Space_AppCenterSecret}\"")
            signingConfig signingConfigs.release
        }
        release {
            buildConfigField('String', 'APP_CENTER_SECRET', "\"${System.env.Space_AppCenterSecret}\"")
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/**'
            excludes += 'okhttp3/**'
            excludes += 'kotlin/**'
            excludes += '**.bin'
            excludes += '**.properties'
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:${compose_bom_version}")
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform("androidx.compose:compose-bom:${compose_bom_version}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Modern libxposed API 102
    compileOnly 'io.github.libxposed:api:102.0.0'

    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'com.google.accompanist:accompanist-insets:0.36.0'
    implementation 'com.google.accompanist:accompanist-flowlayout:0.36.0'
    implementation 'com.squareup.moshi:moshi:1.15.2'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'

    def appCenterSdkVersion = '5.0.4'
    implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
    implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
